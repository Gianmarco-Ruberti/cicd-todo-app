# CI — v1 : install commun, puis audit et lint (backend + frontend).
# Références : Doc/schema-workflow-v2.md, issues #7 et #8, AGENTS.md §8.
# Les étapes suivantes (tests, build, e2e) seront ajoutées plus tard.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Annule les runs obsolètes quand on repousse sur la même branche/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1. Installation commune : les jobs audit et lint réutilisent ces node_modules
  #    au lieu de relancer `npm ci` chacun de leur côté.
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20 + cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Installer le backend
        working-directory: backend
        run: npm ci

      - name: Installer le frontend
        working-directory: frontend
        run: npm ci

      # Chaque job tourne sur un runner neuf : on repasse les node_modules
      # via le cache, avec une clé basée sur les deux lockfiles.
      - name: Mettre les node_modules en cache
        uses: actions/cache@v4
        with:
          path: |
            backend/node_modules
            frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('backend/package-lock.json', 'frontend/package-lock.json') }}

  # 2a. Audit des dépendances (issue #7).
  # ⚠️ Rouge aujourd'hui : des vulnérabilités high/critical existent déjà dans
  # les deux projets, à corriger dans le cadre de l'issue #7.
  audit:
    name: Audit
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm audit ne lit que le lockfile : pas besoin des node_modules ici.
      - name: Audit backend
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Audit frontend
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # 2b. Lint strict (issue #8), en parallèle de l'audit.
  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer les node_modules installés
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/node_modules
            frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('backend/package-lock.json', 'frontend/package-lock.json') }}
          fail-on-cache-miss: true

      # Pas `npm run lint` : le script local fait --fix et masquerait les erreurs.
      - name: ESLint backend (0 erreur, 0 warning)
        working-directory: backend
        run: npx eslint . --max-warnings=0

      - name: ESLint frontend (0 erreur, 0 warning)
        working-directory: frontend
        run: npx eslint . --max-warnings=0
