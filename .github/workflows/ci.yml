# CI/CD — audit → lint → tests → build → déploiement de l'environnement de test.
#
# Chaîne d'exécution (issue #5) :
#   install ─┬─ Back  (audit, lint, tests)      ┐
#            └─ Front (audit, lint)             ├─ build (bundle Vite) ─ deploy (main seulement)
#                                              ┘
# `needs` garantit qu'aucune mise en ligne n'a lieu si une étape a échoué.
#
# Le job `deploy` ne tourne que sur un push vers main. Il rejoint le réseau
# Tailscale, copie les fichiers sur la VM du groupe et recharge PM2.
#
# Secrets du dépôt : TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, SSH_PRIVATE_KEY
# Variables (facultatives) : VM_HOST, TS_TAG, SSH_KNOWN_HOSTS, TEST_URL
#   → les valeurs par défaut sont publiques (pas de secret) ; une variable du
#     dépôt, si elle existe, prend le dessus.
#
# Références : Doc/schema-workflow-v2.md, AGENTS.md §8, PROCEDURE.md du dossier M324.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Annule les runs obsolètes sur une PR, mais jamais un run sur main : une mise
# en ligne en cours ne doit pas être coupée par un push suivant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  VM_HOST: ${{ vars.VM_HOST || 'm324-vm-d' }}
  TS_TAG: ${{ vars.TS_TAG || 'tag:ci-d' }}
  SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS || 'm324-vm-d,10.198.2.14 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEpkY62GKRGLHqUM+SnLi47KKfNc9akULXXvFWo/vu9i' }}
  TEST_URL: ${{ vars.TEST_URL || 'https://m324-vm-d.tailefea5d.ts.net:8443' }}
  TARGET: /var/www/todo/staging

jobs:
  # 1. Installation commune : les jobs suivants réutilisent ces node_modules
  #    au lieu de relancer `npm ci` chacun de leur côté.
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20 + cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Installer le backend
        working-directory: backend
        run: npm ci

      - name: Installer le frontend
        working-directory: frontend
        run: npm ci

      # Chaque job tourne sur un runner neuf : on repasse les node_modules
      # via le cache, avec une clé basée sur les deux lockfiles.
      - name: Mettre les node_modules en cache
        uses: actions/cache@v4
        with:
          path: |
            backend/node_modules
            frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('backend/package-lock.json', 'frontend/package-lock.json') }}

  # 2a. Backend : audit des dépendances (issue #7) puis lint strict (issue #8),
  #     puis les tests d'API (SQLite en mémoire, aucun service externe).
  Back:
    name: Backend
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer les node_modules installés
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/node_modules
            frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('backend/package-lock.json', 'frontend/package-lock.json') }}
          fail-on-cache-miss: true

      - name: Audit backend
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      # Pas `npm run lint` : le script local fait --fix et masquerait les erreurs.
      - name: ESLint backend (0 erreur, 0 warning)
        working-directory: backend
        run: npx eslint . --max-warnings=0

      # Pré-requis des tests (AGENTS.md §8.1) : `.env` doit exister et la clé
      # privée JWT n'est pas versionnée.
      - name: Créer le .env de test
        working-directory: backend
        run: printf 'NODE_ENV=test\n' > .env

      - name: Générer la paire de clés JWT
        working-directory: backend
        run: |
          mkdir -p config/keys
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out config/keys/jwtRS256.key
          openssl rsa -pubout -in config/keys/jwtRS256.key -out config/keys/jwtRS256.key.pub

      - name: Tests backend (couverture, SQLite en mémoire)
        working-directory: backend
        run: npm run test:ci

  # 2b. Frontend : même chose, en parallèle du backend.
  Front:
    name: Frontend
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer les node_modules installés
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/node_modules
            frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('backend/package-lock.json', 'frontend/package-lock.json') }}
          fail-on-cache-miss: true

      # Le build n'embarque pas les devDependencies : seule la surface exposée
      # en production est auditée, comme côté backend.
      - name: Audit frontend
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      # `npx eslint` directement (pas `npm run lint`, qui fait --fix) : on
      # détecte au lieu de corriger en silence sur le runner.
      - name: ESLint frontend (0 erreur, 0 warning)
        working-directory: frontend
        run: npx eslint . --max-warnings=0

  # 3. Build du bundle : produit une seule fois ici, puis repris par le
  #    déploiement. Il n'a lieu que si le lint et les tests sont verts.
  build:
    name: Build frontend
    needs: [Back, Front]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer les node_modules installés
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/node_modules
            frontend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('backend/package-lock.json', 'frontend/package-lock.json') }}
          fail-on-cache-miss: true

      # `build-only` = vite build sans le type-check : le typage n'est pas
      # encore un gate du projet (AGENTS.md §10.5), le bundle seul suffit ici.
      - name: Vite build
        working-directory: frontend
        run: npm run build-only

      - name: Publier le bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # 4. Déploiement de l'environnement de test, sur push vers main uniquement.
  deploy:
    name: Déploiement test
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://m324-vm-d.tailefea5d.ts.net:8443
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Récupérer le bundle construit par la CI
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Rappeler la cible du déploiement
        run: |
          echo "VM : $VM_HOST (tag Tailscale $TS_TAG)"
          echo "Dossier : $TARGET"
          echo "Adresse publique : $TEST_URL"

      # Le runner rejoint le tailnet comme noeud éphémère, avec le tag du groupe :
      # il ne peut joindre que la VM du groupe, et seulement en SSH.
      - name: Rejoindre le tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ env.TS_TAG }}

      # Clé privée en secret, empreinte de la VM en variable : la connexion échoue
      # si la machine jointe ne présente pas la clé d'hôte attendue.
      - name: Configurer SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          VM_IP=$(sudo tailscale ip -4 "$VM_HOST")
          echo "Adresse Tailscale de $VM_HOST : $VM_IP"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          printf '%s\n' \
            'Host vm' \
            "    HostName $VM_IP" \
            "    HostKeyAlias $VM_HOST" \
            '    User deploy' \
            '    IdentityFile ~/.ssh/id_ed25519' \
            '    IdentitiesOnly yes' \
            '    StrictHostKeyChecking yes' \
            '    ConnectTimeout 15' > ~/.ssh/config
          chmod 600 ~/.ssh/config

          ssh vm 'echo "Connecté à $(hostname) en tant que $(whoami)"'

      - name: Copier le frontend
        run: rsync -az --delete frontend/dist/ "vm:$TARGET/frontend/"

      # Seules les clés JWT sont exclues (générées sur la VM) : le dossier
      # `config/keys/` doit être copié, sinon `require('../config/keys')` échoue.
      - name: Copier le backend
        run: |
          rsync -az --delete \
            --exclude node_modules/ \
            --exclude coverage/ \
            --exclude tests/ \
            --exclude .env \
            --exclude config/keys/jwtRS256.key \
            --exclude config/keys/jwtRS256.key.pub \
            backend/ "vm:$TARGET/backend/"

      - name: Installer les dépendances et recharger PM2
        run: |
          ssh vm "TARGET=$TARGET bash -s" <<'EOF'
          set -e
          cd "$TARGET/backend"

          # La clé JWT n'est pas versionnée (AGENTS.md §8.1) : elle est générée
          # une seule fois sur la VM, puis conservée d'un déploiement à l'autre.
          if [ ! -f config/keys/jwtRS256.key ]; then
            mkdir -p config/keys
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out config/keys/jwtRS256.key
            openssl rsa -pubout -in config/keys/jwtRS256.key -out config/keys/jwtRS256.key.pub
          fi

          npm ci --omit=dev
          pm2 startOrReload ecosystem.config.js
          pm2 save
          EOF

      # Le runner n'a accès qu'au port 22 : les tests HTTP passent par nginx sur la VM.
      # Frontend : 200. API sans jeton : 401 (l'API répond, l'authentification protège).
      - name: Vérifier l'environnement sur la VM
        run: |
          ssh vm bash -s <<'EOF'
          for i in $(seq 1 10); do
            front=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)
            api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/todo)
            if [ "$front" = "200" ] && { [ "$api" = "401" ] || [ "$api" = "200" ]; }; then
              echo "Environnement en ligne — frontend : $front, API : $api"
              exit 0
            fi
            sleep 2
          done
          echo "L'environnement ne répond pas — frontend : $front, API : $api"
          echo "--- pm2 status ---"
          pm2 status || true
          echo "--- 30 dernières lignes de logs ---"
          pm2 logs todo-staging --nostream --lines 30 || true
          exit 1
          EOF

      # Libère le noeud éphémère tout de suite, même en cas d'échec.
      - name: Quitter le tailnet
        if: always()
        run: sudo tailscale logout || true

      - name: Vérifier l'adresse publique
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "$TEST_URL/"
          echo "Adresse publique joignable : $TEST_URL"

      - name: Résumé
        run: |
          {
            echo "### Environnement de test déployé"
            echo "- VM : \`$VM_HOST\`"
            echo "- Version : \`${GITHUB_SHA::7}\`"
            echo "- Adresse : $TEST_URL"
          } >> "$GITHUB_STEP_SUMMARY"
