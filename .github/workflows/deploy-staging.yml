# CD — déploiement du staging sur la VM du groupe (m324-vm-d), à travers Tailscale.
#   - automatiquement à chaque push sur main ;
#   - manuellement depuis l'onglet Actions (workflow_dispatch).
#
# Secrets du dépôt : TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, SSH_PRIVATE_KEY
# Variables du dépôt (facultatives) : VM_HOST, TS_TAG, SSH_KNOWN_HOSTS, STAGING_URL
#   → les valeurs par défaut ci-dessous sont publiques (pas de secret) ; une
#     variable du dépôt, si elle existe, prend le dessus.
# Environnement : staging (créé automatiquement au premier run)
#
# Cible sur la VM : frontend dans /var/www/todo/staging/frontend (nginx :8080),
# backend PM2 `todo-staging` sur le port 3001, variables dans /etc/todo/staging.env.
#
# Références : Doc/schema-workflow-v2.md (étape 9), AGENTS.md §8, PROCEDURE.md du dossier M324.

name: Déploiement staging

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois : on ne coupe pas une mise en ligne en cours.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

# Le workflow ne lit que le dépôt ; les secrets servent Tailscale et SSH.
permissions:
  contents: read

env:
  VM_HOST: ${{ vars.VM_HOST || 'm324-vm-d' }}
  TS_TAG: ${{ vars.TS_TAG || 'tag:ci-d' }}
  SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS || 'm324-vm-d,10.198.2.14 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEpkY62GKRGLHqUM+SnLi47KKfNc9akULXXvFWo/vu9i' }}
  STAGING_URL: ${{ vars.STAGING_URL || 'https://m324-vm-d.tailefea5d.ts.net:8443' }}
  TARGET: /var/www/todo/staging

jobs:
  deploy-staging:
    name: Staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Rappeler la cible du déploiement
        run: |
          echo "VM : $VM_HOST (tag Tailscale $TS_TAG)"
          echo "Dossier : $TARGET"
          echo "Adresse publique : $STAGING_URL"

      # Le frontend est construit ici, dans le runner : la VM ne reçoit que le bundle.
      - name: Node 20 + cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Construire le frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build-only

      # Le runner rejoint le tailnet comme noeud éphémère, avec le tag du groupe :
      # il ne peut joindre que la VM du groupe, et seulement en SSH.
      - name: Rejoindre le tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ env.TS_TAG }}

      # Clé privée en secret, empreinte de la VM en variable : la connexion échoue
      # si la machine jointe ne présente pas la clé d'hôte attendue.
      - name: Configurer SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          VM_IP=$(sudo tailscale ip -4 "$VM_HOST")
          echo "Adresse Tailscale de $VM_HOST : $VM_IP"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          printf '%s\n' \
            'Host vm' \
            "    HostName $VM_IP" \
            "    HostKeyAlias $VM_HOST" \
            '    User deploy' \
            '    IdentityFile ~/.ssh/id_ed25519' \
            '    IdentitiesOnly yes' \
            '    StrictHostKeyChecking yes' \
            '    ConnectTimeout 15' > ~/.ssh/config
          chmod 600 ~/.ssh/config

          ssh vm 'echo "Connecté à $(hostname) en tant que $(whoami)"'

      - name: Copier le frontend
        run: rsync -az --delete frontend/dist/ "vm:$TARGET/frontend/"

      # `config/keys/` est exclu : les clés JWT générées sur la VM ne doivent pas
      # être effacées par --delete, ni écrasées par une clé locale.
      - name: Copier le backend
        run: |
          rsync -az --delete \
            --exclude node_modules/ \
            --exclude coverage/ \
            --exclude tests/ \
            --exclude .env \
            --exclude config/keys/ \
            backend/ "vm:$TARGET/backend/"

      - name: Installer les dépendances et recharger PM2
        run: |
          ssh vm "TARGET=$TARGET bash -s" <<'EOF'
          set -e
          cd "$TARGET/backend"

          # La clé JWT n'est pas versionnée (AGENTS.md §8.1) : elle est générée
          # une seule fois sur la VM, puis conservée d'un déploiement à l'autre.
          if [ ! -f config/keys/jwtRS256.key ]; then
            mkdir -p config/keys
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out config/keys/jwtRS256.key
            openssl rsa -pubout -in config/keys/jwtRS256.key -out config/keys/jwtRS256.key.pub
          fi

          npm ci --omit=dev
          pm2 startOrReload ecosystem.config.js
          pm2 save
          EOF

      # Le runner n'a accès qu'au port 22 : les tests HTTP passent par nginx sur la VM.
      # Frontend : 200. API sans jeton : 401 (l'API répond, l'authentification protège).
      - name: Vérifier le staging sur la VM
        run: |
          ssh vm bash -s <<'EOF'
          for i in $(seq 1 10); do
            front=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)
            api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/todo)
            if [ "$front" = "200" ] && { [ "$api" = "401" ] || [ "$api" = "200" ]; }; then
              echo "Staging en ligne — frontend : $front, API : $api"
              exit 0
            fi
            sleep 2
          done
          echo "Le staging ne répond pas — frontend : $front, API : $api"
          echo "--- pm2 status ---"
          pm2 status || true
          echo "--- 30 dernières lignes de logs ---"
          pm2 logs todo-staging --nostream --lines 30 || true
          exit 1
          EOF

      # Libère le noeud éphémère tout de suite, même en cas d'échec.
      - name: Quitter le tailnet
        if: always()
        run: sudo tailscale logout || true

      # Vérifie l'adresse publique après la sortie du tailnet, donc comme un
      # visiteur venu d'Internet (HTTPS publié par Tailscale Funnel).
      - name: Vérifier l'adresse publique
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "$STAGING_URL/"
          echo "Adresse publique joignable : $STAGING_URL"

      - name: Résumé
        run: |
          {
            echo "### Staging déployé"
            echo "- VM : \`$VM_HOST\`"
            echo "- Version : \`${GITHUB_SHA::7}\`"
            echo "- Adresse : $STAGING_URL"
          } >> "$GITHUB_STEP_SUMMARY"
